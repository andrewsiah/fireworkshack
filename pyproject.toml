[project]
name = "fireworkshack"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fireworks-ai[training-sdk]>=1.2.30,<2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
]

[project.scripts]
fireworkshack = "fireworkshack.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
